[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Public, non-secret on-chain address of the ArcPayRemit contract (Arc Testnet).
  VITE_ARCPAY_CONTRACT = "0xca7513a215db0f0c00b4331cf204aed6e7cf6f95"

# Single-page app: let React Router handle client-side routes like /send and /receive.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
